name: empire-sync

# Auto-update the hub from the ares repos once a day. Reads each ares… repo's
# docs, has Groq fill the boxes, merges into data/state.json, and commits.
# aresync pulls ares-empire on the server and redeploys → the hub updates.
#
# Required repo secrets (Settings → Secrets and variables → Actions → repository secret):
#   EMPIRE_GH_TOKEN  — a PAT (classic: `repo`, or fine-grained: read access to
#                      contents+metadata on the ares repos) so the job can LIST
#                      and READ the other (private) ares repos and push back here.
#   EMPIRE_LLM_KEY   — the LLM API key (same value as ares-empire/.env EMPIRE_LLM_KEY).
# Provider/model are plain env below (not secret) — mirror ares-empire/.env.

on:
  schedule:
    - cron: "0 4 * * *"      # daily 04:00 UTC
  workflow_dispatch:          # manual "Run workflow" button for testing

permissions:
  contents: write             # allow the commit-back (also covered by the PAT)

concurrency:
  group: empire-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.EMPIRE_GH_TOKEN }}   # so the push back is authenticated

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet requests openai

      - name: Sync the empire state
        env:
          EMPIRE_GH_TOKEN: ${{ secrets.EMPIRE_GH_TOKEN }}
          EMPIRE_LLM_KEY: ${{ secrets.EMPIRE_LLM_KEY }}
          # Non-secret config — keep in step with ares-empire/.env:
          EMPIRE_LLM_PROVIDER: nvidia
          EMPIRE_LLM_MODEL: mistralai/mistral-small-4-119b-2603
          EMPIRE_LLM_FALLBACK_MODEL: mistralai/mistral-medium-3.5-128b
          GH_OWNER: ${{ github.repository_owner }}
        run: python tools/empire_sync.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- data/state.json; then
            echo "no changes"; exit 0
          fi
          git config user.name  "empire-sync"
          git config user.email "empire-sync@users.noreply.github.com"
          git add data/state.json
          git commit -m "empire-sync: refresh hub from repos $(date -u +%F)"
          git push
