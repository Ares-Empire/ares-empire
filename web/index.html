<!DOCTYPE html>
<html lang="en" data-theme="empire">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Ares Empire</title>
<link rel="icon" type="image/png" href="brand/ares-bust-icon.png" />
<link rel="apple-touch-icon" href="brand/ares-bust-icon.png" />
<!-- intro anti-flash: while the first-load intro is pending, keep the hub
     hidden behind the bust-slam so the empire never flashes before the intro morphs in.
     boot.jsx adds .ares-booting synchronously and removes it as the intro crossfades. -->
<style>html.ares-booting{background:#000}html.ares-booting #root{visibility:hidden}</style>
<!-- the intro bust downloads first, ahead of the scripts (the intro waits for it) -->
<link rel="preload" as="image" href="brand/ares-bust.webp" type="image/webp" fetchpriority="high" />
<link rel="stylesheet" href="fonts/fonts.css" />
<script src="vendor/lucide-0.460.0.js"></script>
<link rel="stylesheet" href="app/styles.css" />
<link rel="stylesheet" href="app/mobile.css" />
</head>
<body>
<div id="root"></div>

<script src="vendor/react-18.3.1.production.min.js"></script>
<script src="vendor/react-dom-18.3.1.production.min.js"></script>
<script src="vendor/babel-7.29.0.min.js"></script>

<!-- data + non-JSX modules (load before the JSX that consumes them) -->
<script src="app/empire-data.js"></script>
<script src="app/empire-api.js"></script>
<script src="app/empire-intro.js"></script>

<!-- JSX (compiled in-browser by Babel standalone, same as Aresium/Arestoteles) -->
<script type="text/babel" src="app/brand.jsx"></script>
<script type="text/babel" src="app/ring.jsx"></script>
<script type="text/babel" src="app/panels.jsx"></script>
<script type="text/babel" src="app/app.jsx"></script>
<script type="text/babel" src="app/mobile.jsx"></script>
<script type="text/babel" src="app/boot.jsx"></script>
</body>
</html>
