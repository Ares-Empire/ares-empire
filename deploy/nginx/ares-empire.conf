# ============================================================
# Ares Empire — ares-empire.de  (HTTP bootstrap vhost)
# Additive vhost on the shared insureai_nginx gateway. Coexists with default.conf
# (insureares), aresium.conf and arestoteles.conf — all untouched. Proxies to the
# empire hub running as a host systemd service on the bridge gateway 172.18.0.1:5185.
#
# This is the pre-TLS bootstrap: it serves the ACME challenge and proxies over HTTP so
# nothing references a cert that doesn't exist yet (a broken vhost would take down every
# site on reload). enable-tls-ares-empire.sh replaces it with the HTTPS version once the
# cert is issued. The hub gates itself (scrypt + signed cookie) — no nginx basic-auth.
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name ares-empire.de www.ares-empire.de;

    # Let's Encrypt HTTP-01 challenge (certbot drops files here)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://172.18.0.1:5185;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
        proxy_send_timeout    30s;
    }
}
