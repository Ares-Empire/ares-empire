[Service]
ExecStartPre=
ExecStartPre=/usr/local/sbin/home-front render --for-start
ExecStart=
ExecStart=/usr/sbin/haproxy -Ws -f /etc/haproxy/haproxy.cfg -p /run/haproxy.pid
ExecReload=
ExecReload=/usr/local/sbin/home-front render --for-reload
ExecReload=/usr/local/sbin/home-front _reload-front ${MAINPID}
KillMode=control-group
